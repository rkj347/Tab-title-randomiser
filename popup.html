<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tab Title Randomiser</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Tab Control</h1>
    <p class="description">Manage your tab appearance.</p>
    <button id="purgeTabsBtn" class="btn btn-primary">Purge Tabs</button>
    <button id="professionalModeBtn" class="btn btn-success">Professional Mode</button>
    <button id="undoPurgeBtn" class="btn btn-secondary">Undo</button>
    <!-- Placeholder for future buttons -->
    <div class="button-group">
       <!-- Future buttons will go here -->
    </div>
    <div class="shortcut-hint">
      <p class="shortcut-text">💡 Quick tip: Press <kbd>Ctrl+Shift+Y</kbd> (Mac: <kbd>Cmd+Shift+Y</kbd>) to hide all tabs instantly!</p>
      <p class="shortcut-text">↶ Press <kbd>Ctrl+Shift+U</kbd> (Mac: <kbd>Cmd+Shift+U</kbd>) to undo changes!</p>
      <p class="shortcut-note">Set your custom shortcuts at <code>chrome://extensions/shortcuts</code></p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
